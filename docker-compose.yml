services:
  taawun:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      PORT: "8080"
      APP_DB_PATH: /data/taawun.db
      TAWUN_ARTIFACT_ROOT: /data/artifacts
      TAWUN_PUBLIC_BASE_URL: http://localhost:8080
      TAWUN_ALLOWED_ORIGINS: http://localhost:8080
      TAWUN_MCP_ALLOWED_HOSTS: localhost:8080
      RELAY_ALLOWED_ORIGINS: http://localhost:8080
    volumes:
      - taawun-data:/data
    tmpfs:
      - /tmp:size=64m,mode=1777
    read_only: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  taawun-data:
