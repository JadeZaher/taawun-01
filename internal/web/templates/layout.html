<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{if .PageTitle}}{{.PageTitle}} - {{end}}Taawun</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { letter-spacing: .01em; }
        .hero { padding: 6rem 0 4rem; }
        .brand { font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
        .card { border-radius: 2px; }
        .btn { border-radius: 2px; }
        footer { font-size: .8rem; }
    </style>
</head>
<body class="d-flex flex-column min-vh-100 bg-white">
    <nav class="navbar navbar-expand-lg border-bottom">
        <div class="container">
            <a href="/" class="navbar-brand brand">Taawun</a>
            <div class="ms-auto d-flex align-items-center gap-2">
                {{if .UserID}}
                    <span class="badge text-bg-light border">{{.UserRole}}</span>
                    <a class="nav-link" href="/dashboard">Dashboard</a>
                    <a class="nav-link" href="/workspaces">Workspaces</a>
                    {{if eq .UserRole "admin"}}<a class="nav-link" href="/admin">Admin</a>{{end}}
                    <a class="btn btn-outline-dark btn-sm" href="/logout">Logout</a>
                {{else}}
                    <a class="nav-link" href="/login">Login</a>
                    <a class="btn btn-dark btn-sm" href="/register">Register</a>
                {{end}}
            </div>
        </div>
    </nav>
    <main class="flex-grow-1">{{block "content" .}}{{end}}</main>
    <footer class="border-top py-3 text-center text-muted">
        <div class="container">&copy; 2026 Taawun. All rights reserved.</div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function getCookie(n){const m=document.cookie.match(new RegExp('(?:^|; )'+n+'=([^;]*)'));return m?decodeURIComponent(m[1]):''}
        async function api(path,opts={}){
            opts.headers=Object.assign({'Content-Type':'application/json','X-CSRF-Token':getCookie('csrf_token')},opts.headers||{});
            if(opts.body&&typeof opts.body!=='string')opts.body=JSON.stringify(opts.body);
            return fetch(path,opts);
        }
    </script>
</body>
</html>
