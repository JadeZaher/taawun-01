{{define "content"}}
<div class="container py-5 text-center">
    {{if .Success}}
        <h4 class="fw-bold">Email verified</h4>
        <p class="text-muted">Your account is now active.</p>
        <a href="/login" class="btn btn-dark">Continue to login</a>
    {{else}}
        <h4 class="fw-bold">Verification failed</h4>
        <p class="text-muted">This verification link is invalid or has already been used.</p>
        <a href="/login" class="btn btn-outline-secondary">Back to login</a>
    {{end}}
</div>
{{end}}
