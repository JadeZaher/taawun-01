{{define "content"}}
<div class="container py-5">
    <div class="row justify-content-center"><div class="col-md-5">
        <div class="card p-4">
            <h5 class="fw-bold mb-4">Create Account</h5>
            <form id="registerForm">
                <div class="mb-3"><label class="form-label small">Full Name</label><input type="text" id="name" class="form-control" required></div>
                <div class="mb-3"><label class="form-label small">Email</label><input type="email" id="email" class="form-control" required></div>
                <div class="mb-3"><label class="form-label small">Password</label><input type="password" id="password" class="form-control" required minlength="6"></div>
                <div id="registerError" class="alert alert-danger py-2 d-none small"></div>
                <button class="btn btn-dark w-100">Register</button>
                <p class="small text-muted mt-3 mb-0">Already registered? <a href="/login">Login</a></p>
            </form>
        </div>
    </div></div>
</div>
<script>
document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const err = document.getElementById('registerError');
    err.classList.add('d-none');
    try {
        const response = await api('/api/v1/auth/register', { method: 'POST', body: { name: document.getElementById('name').value, email: document.getElementById('email').value, password: document.getElementById('password').value } });
        const result = await response.json();
        if (response.ok) { window.location.href = '/dashboard'; }
        else { err.textContent = result.error || 'Registration failed'; err.classList.remove('d-none'); }
    } catch { err.textContent = 'Network error. Please try again.'; err.classList.remove('d-none'); }
});
</script>
{{end}}
