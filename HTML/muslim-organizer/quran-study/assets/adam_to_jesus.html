<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Divine Timeline</title>

    <style>

        :root {

            --primary: #2c3e50;

            --secondary: #3498db;

            --accent: #e74c3c;

            --light: #ecf0f1;

            --dark: #2c3e50;

            --success: #27ae60;

            --warning: #f39c12;

        }



        body {

            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

            line-height: 1.6;

            color: #333;

            background-color: #f5f5f5;

            margin: 0;

            padding: 0;

        }



        .container {

            max-width: 1200px;

            margin: 0 auto;

            padding: 20px;

        }



        header {

            background: linear-gradient(135deg, var(--primary), var(--secondary));

            color: white;

            text-align: center;

            padding: 2rem 0;

            margin-bottom: 2rem;

            border-radius: 8px;

            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);

        }



        h1 {

            margin: 0;

            font-size: 2.5rem;

        }



        .subtitle {

            font-style: italic;

            opacity: 0.9;

        }



        .timeline {

            position: relative;

            max-width: 1200px;

            margin: 0 auto;

        }



        .timeline::after {

            content: '';

            position: absolute;

            width: 6px;

            background-color: var(--secondary);

            top: 0;

            bottom: 0;

            left: 50%;

            margin-left: -3px;

            border-radius: 3px;

        }



        .event {

            padding: 10px 40px;

            position: relative;

            background-color: inherit;

            width: 50%;

            margin-bottom: 30px;

        }



        .event::after {

            content: '';

            position: absolute;

            width: 25px;

            height: 25px;

            right: -17px;

            background-color: white;

            border: 4px solid var(--accent);

            top: 15px;

            border-radius: 50%;

            z-index: 1;

        }



        .left {

            left: 0;

        }



        .right {

            left: 50%;

        }



        .left::before {

            content: " ";

            height: 0;

            position: absolute;

            top: 22px;

            width: 0;

            z-index: 1;

            right: 30px;

            border: medium solid var(--light);

            border-width: 10px 0 10px 10px;

            border-color: transparent transparent transparent var(--light);

        }



        .right::before {

            content: " ";

            height: 0;

            position: absolute;

            top: 22px;

            width: 0;

            z-index: 1;

            left: 30px;

            border: medium solid var(--light);

            border-width: 10px 10px 10px 0;

            border-color: transparent var(--light) transparent transparent;

        }



        .right::after {

            left: -16px;

        }



        .content {

            padding: 20px 30px;

            background-color: white;

            position: relative;

            border-radius: 6px;

            box-shadow: 0 3px 5px rgba(0, 0, 0, 0.1);

            transition: transform 0.3s ease, box-shadow 0.3s ease;

        }



        .content:hover {

            transform: translateY(-5px);

            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);

        }



        .year {

            font-weight: bold;

            color: var(--accent);

            font-size: 1.2rem;

            margin-bottom: 5px;

        }



        .creator {

            color: var(--success);

            font-weight: bold;

        }



        .famous-name {

            color: var(--secondary);

            font-weight: bold;

        }



        .false-god {

            color: var(--warning);

            font-weight: bold;

        }



        .footnotes {

            background-color: var(--light);

            padding: 20px;

            border-radius: 8px;

            margin-top: 40px;

        }



        .footnotes h2 {

            color: var(--primary);

            border-bottom: 2px solid var(--secondary);

            padding-bottom: 10px;

        }



        .footnote-item {

            margin-bottom: 15px;

        }



        .footnote-ref {

            font-weight: bold;

            color: var(--accent);

        }



        @media screen and (max-width: 768px) {

            .timeline::after {

                left: 31px;

            }



            .event {

                width: 100%;

                padding-left: 70px;

                padding-right: 25px;

            }



            .event::before {

                left: 60px;

                border: medium solid white;

                border-width: 10px 10px 10px 0;

                border-color: transparent white transparent transparent;

            }



            .left::after, .right::after {

                left: 15px;

            }



            .right {

                left: 0%;

            }

        }



        .quran-verse {

            font-style: italic;

            color: #555;

            border-left: 3px solid var(--success);

            padding-left: 10px;

            margin: 10px 0;

        }



        .controls {

            display: flex;

            justify-content: center;

            gap: 15px;

            margin-bottom: 20px;

            flex-wrap: wrap;

        }



        button {

            padding: 8px 16px;

            border: none;

            border-radius: 4px;

            background-color: var(--secondary);

            color: white;

            cursor: pointer;

            transition: background-color 0.3s;

        }



        button:hover {

            background-color: var(--primary);

        }



        .active {

            background-color: var(--accent);

        }

    </style>

</head>

        // Function to create timeline events

        function createTimeline() {

            const timeline = document.getElementById('timeline');

            const footnotesContainer = document.getElementById('footnotes');



            // Clear existing content

            timeline.innerHTML = '';

            footnotesContainer.innerHTML = '';



            // Create timeline events

            timelineData.forEach((event, index) => {

                const eventElement = document.createElement('div');

                eventElement.className = `event ${index % 2 === 0 ? 'left' : 'right'}`;



                let contentHTML = `

                    <div class="content">
                        <div class="year">${event.year}</div>

                `;



                if (event.creator) {

                    contentHTML += `<p><span class="creator">Real Creator of the Universe:</span> ${event.creator}</p>`;

                }



                if (event.famousName) {

                    contentHTML += `<p><span class="famous-name">The Famous Name or Event:</span> ${event.famousName}</p>`;

                }



                if (event.falseGod) {

                    contentHTML += `<p><span class="false-god">False Physical or Abstract god/goddess:</span> ${event.falseGod}</p>`;

                }



                // Add footnotes indicator if there are any

                if (event.footnotes && event.footnotes.length > 0) {

                    const footnoteId = `footnote-${index}`;

                    contentHTML += `<div class="quran-verse" id="${footnoteId}-preview">${event.footnotes[0]}</div>`;



                    // Create full footnotes

                    event.footnotes.forEach((note, noteIndex) => {

                        const footnoteElement = document.createElement('div');

                        footnoteElement.className = 'footnote-item';

                        footnoteElement.innerHTML = `

                            <span class="footnote-ref">${event.year.split(' ')[1]}-${noteIndex + 1}:</span> ${note}

                        `;

                        footnotesContainer.appendChild(footnoteElement);

                    });

                }



                contentHTML += `</div>`;

                eventElement.innerHTML = contentHTML;

                timeline.appendChild(eventElement);

            });

        }



        // Filter functions

        function filterTimeline(filterType) {

            const events = document.querySelectorAll('.event');



            events.forEach(event => {

                const content = event.querySelector('.content');

                let showEvent = false;



                switch(filterType) {

                    case 'creator':

                        showEvent = content.querySelector('.creator') !== null;

                        break;

                    case 'falseGods':

                        showEvent = content.querySelector('.false-god') !== null;

                        break;

                    case 'quran':

                        showEvent = content.querySelector('.quran-verse') !== null;

                        break;

                    case 'all':

                        showEvent = true;

                        break;

                }



                if (showEvent) {

                    event.style.display = 'block';

                } else {

                    event.style.display = 'none';

                }

            });



            // Update active button

            document.querySelectorAll('.controls button').forEach(btn => {

                btn.classList.remove('active');

            });

            document.getElementById(`show${filterType.charAt(0).toUpperCase() + filterType.slice(1)}`).classList.add('active');

        }



        // Initialize the page

        document.addEventListener('DOMContentLoaded', () => {

            createTimeline();



            // Set up event listeners for filter buttons

            document.getElementById('showAll').addEventListener('click', () => filterTimeline('all'));

            document.getElementById('showCreator').addEventListener('click', () => filterTimeline('creator'));

            document.getElementById('showFalseGods').addEventListener('click', () => filterTimeline('falseGods'));

            document.getElementById('showQuran').addEventListener('click', () => filterTimeline('quran'));



            // Show all by default

            filterTimeline('all');

        });
